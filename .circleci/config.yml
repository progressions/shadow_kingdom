version: 2.1

orbs:
  node: circleci/node@5.1.0

jobs:
  test:
    docker:
      - image: cimg/node:18.20
    environment:
      DATABASE_URL: file:./test.db
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Generate Prisma client
          command: npm run db:generate
      - run:
          name: Run tests
          command: npm test
      - run:
          name: Run tests with coverage
          command: npm run test:coverage
      - store_test_results:
          path: coverage
      - store_artifacts:
          path: coverage
          destination: coverage

  build:
    docker:
      - image: cimg/node:18.20
    environment:
      DATABASE_URL: file:./test.db
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Generate Prisma client
          command: npm run db:generate
      - run:
          name: Build TypeScript
          command: npm run build
      - store_artifacts:
          path: dist
          destination: dist

  lint:
    docker:
      - image: cimg/node:18.20
    environment:
      DATABASE_URL: file:./test.db
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Generate Prisma client
          command: npm run db:generate
      - run:
          name: Run linting
          command: npm run lint
      - run:
          name: Check formatting
          command: npx prettier --check "src/**/*.{ts,tsx}"
      - run:
          name: Check TypeScript types
          command: npx tsc --noEmit

  database:
    docker:
      - image: cimg/node:18.20
    environment:
      DATABASE_URL: file:./test.db
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Generate Prisma client
          command: npm run db:generate
      - run:
          name: Validate Prisma schema
          command: npx prisma validate
      - run:
          name: Check for pending migrations
          command: |
            npx prisma migrate status || echo "Migration check complete"

workflows:
  version: 2
  test_and_build:
    jobs:
      - test
      - build
      - lint
      - database
  
  # Run on pull requests
  pull_request:
    jobs:
      - test:
          filters:
            branches:
              ignore: main
      - build:
          filters:
            branches:
              ignore: main
      - lint:
          filters:
            branches:
              ignore: main
      - database:
          filters:
            branches:
              ignore: main